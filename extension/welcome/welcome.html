<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to Lantern</title>
<style>
  body { font: 20px/1.5 system-ui, sans-serif; max-width: 560px; margin: 80px auto; padding: 0 16px; color: #1b1b1b; }
  h1 { font-size: 34px; margin-bottom: 8px; }
  button { font: inherit; padding: 14px 28px; border: 0; border-radius: 999px; background: #ffb703; cursor: pointer; }
  #status { margin-top: 20px; }
  kbd { background: #eee; border-radius: 6px; padding: 2px 8px; }
</style>
</head>
<body>
  <h1>Welcome to Lantern</h1>
  <p>Lantern listens when you ask for help, so it needs your microphone. You only do this once.</p>
  <button id="allow">Allow microphone</button>
  <p id="status"></p>
  <p>To ask for help on any website, click the Lantern button in the bottom-right corner, or press <kbd>Alt+L</kbd>.</p>
  <script src="welcome.js"></script>
</body>
</html>
